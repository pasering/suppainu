<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ハイブリッド大富豪EX</title><script defer src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script><style>
:root{--gold:#e7c17b;--ink:#f6e9cb}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 38%,#28665d 0,#123b39 50%,#071d25 100%);color:var(--ink);font-family:system-ui,'Yu Gothic',sans-serif;min-height:100dvh}body:before{content:'';position:fixed;inset:12px;border:2px solid #bb955a55;border-radius:28px;pointer-events:none}button,input{font:inherit}button{cursor:pointer;border:1px solid #c9a36a;background:linear-gradient(#76542f,#3b2a21);color:#fff3d9;border-radius:9px;padding:10px 14px}button:disabled{opacity:.35;cursor:default}button:hover:not(:disabled){filter:brightness(1.18)}input{background:#0c292b;color:white;border:1px solid #c2a16e;border-radius:7px;padding:10px;max-width:100%}.panel{background:#071b23dc;border:1px solid #b99761;border-radius:18px;padding:20px;box-shadow:0 16px 45px #0007}#lobby{max-width:700px;margin:8vh auto;padding:20px}h1{font-family:Georgia,serif;letter-spacing:.07em;color:#f9d89b;text-shadow:0 3px 12px #000;font-size:clamp(28px,6vw,54px);text-align:center;margin:8px 0}h2{color:var(--gold)}.sub{text-align:center;letter-spacing:.25em;color:#d6c4a2}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}.small{font-size:12px;color:#d2c7af}.hidden{display:none!important}#game{padding:12px;max-width:1250px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:10px}.table{position:relative;min-height:330px;border:13px ridge #78502e;border-radius:50% / 35%;margin:18px auto;background:#155145 url("assets/felt.svg") center/cover;box-shadow:inset 0 0 50px #001a19,0 15px 35px #0008;display:flex;align-items:center;justify-content:center;flex-direction:column}.table:after{content:'HYBRID DAIFUGO EX';position:absolute;bottom:16px;letter-spacing:.4em;color:#f4d9a52c;font:18px Georgia;pointer-events:none}.players{display:flex;justify-content:space-around;gap:7px;flex-wrap:wrap}.player{background:#08262bbd;border:1px solid #927650;border-radius:12px;padding:9px;min-width:100px;text-align:center}.active{border-color:#ffe098;box-shadow:0 0 15px #e7c17b99}.cards{display:flex;justify-content:center;flex-wrap:wrap;gap:5px}.card{position:relative;width:65px;height:95px;background:#f8ebd1 url("assets/cardface.svg") center/100% 100%;border:2px solid #fff6dc;border-radius:8px;box-shadow:1px 4px 6px #0008;color:#151c28;display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none;transition:transform .15s}.card:before{content:'';position:absolute;inset:4px;border:1px solid #b69a67;border-radius:5px;pointer-events:none}.card.red{color:#a22c38}.card .corner{position:absolute;top:5px;left:8px;font:bold 17px Georgia}.card .suit{font-size:39px;line-height:1}.card .mini{font-size:10px;position:absolute;bottom:6px}.card.selected{transform:translateY(-16px);box-shadow:0 0 0 3px #ffe19a,0 8px 15px #0008}.card.back{background:#162b48 url("assets/cardback.svg") center/cover;border:4px double #e9cc94}.card.joker{background:#302849 url("assets/jokerface.svg") center/100% 100%;color:#ffdf9c}.card.joker .suit{font-size:25px}.center{min-height:125px;display:flex;gap:5px;align-items:center;justify-content:center;flex-wrap:wrap}.controls{text-align:center;margin:8px}.hand{min-height:115px;padding:20px 5px 5px;display:flex;gap:4px;justify-content:center;flex-wrap:wrap}.hand .card{cursor:pointer}.status{text-align:center;color:#ffe1a1;margin:6px;min-height:25px}.log{max-height:130px;overflow:auto;font-size:12px;color:#d9d4bd;line-height:1.8}.badge{background:#a67734;color:#fff;border-radius:20px;padding:3px 9px;font-size:12px}.rules{max-height:260px;overflow:auto;font-size:13px;line-height:1.9}.rule{border-bottom:1px solid #ffffff25;padding:5px 0}@media(max-width:600px){.card{width:44px;height:68px;border-radius:5px}.card .corner{font-size:13px;top:4px;left:5px}.card .suit{font-size:27px}.card .mini{font-size:8px}.table{min-height:260px;border-width:8px}.player{min-width:75px;font-size:12px}.hand{gap:3px}button{padding:9px}}

/* v0.4 layout */
#lobby{max-width:790px;margin:3vh auto;padding:14px}#lobby .panel{padding:clamp(16px,4vw,28px)}
.lobby-grid{max-width:480px;margin:auto}.lobby-grid label{display:block;color:#f1dfbf;font-weight:700;margin:13px 0 7px}.lobby-grid input{display:block;width:100%}.lobby-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.lobby-actions button{min-height:48px;font-weight:700}.lobby-divider{display:flex;align-items:center;gap:12px;color:#b9a383;font-size:12px;margin:13px 0}.lobby-divider:before,.lobby-divider:after{content:'';height:1px;background:#a58a624a;flex:1}.room-field{margin:0 0 18px}.member-line{display:flex;align-items:center;justify-content:space-between;min-height:37px;padding:8px 13px;border-bottom:1px solid #dbc39f27}.member-line:nth-child(odd){background:#fff1cf0a}.member-line.empty{color:#9ba9a6}.cpu-tag{font-size:11px;color:#9eefd6}.micro{font-size:12px;padding:4px 8px}.lobby-area{margin:18px 0;padding:12px;border-radius:12px;background:#02151b70;border:1px solid #ab92624d}.lobby-area h2{font-size:18px;margin:2px 0 8px}.waiting-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.room-code{font-family:monospace;color:#ffdf9c;font-size:20px;letter-spacing:2px}.lobby-status{min-height:32px;padding:8px 0;text-align:center}.audio-panel{margin:14px 0;padding:13px;border:1px solid #9d805450;border-radius:12px;background:#02171b9c}.audio-controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.audio-col label{display:flex;gap:8px;align-items:center;font-size:13px;margin:8px 0}.audio-col input[type=range]{width:calc(100% - 48px);accent-color:#e7c17b;vertical-align:middle}.audio-col output{font-variant-numeric:tabular-nums;font-size:12px;color:#e5d2ac}.audio-panel summary{cursor:pointer;font-weight:650;color:#f0d4a0}.audio-panel summary::marker{color:#e7c17b}
.card{flex-shrink:0}.card.joker .suit{font:bold 23px Georgia;text-shadow:0 1px 4px #130920}.card.joker .mini{color:#ffe3a2}.card .mini{text-shadow:0 1px 1px #ffffffaa}.card:focus-visible{outline:3px solid #ffe49c;outline-offset:3px}.controls select{background:#163b3c;color:#fff1dc;border:1px solid #b59667;padding:8px;border-radius:8px}.game-under{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(260px,1fr);gap:13px;align-items:start;margin:12px 0}.game-under .panel{padding:14px}.game-rules{max-height:290px;overflow:auto}.game-rules details>summary{font-weight:700;color:#ffdd9d;cursor:pointer;padding:4px}.free-table{font:24px Georgia;color:#ddc493;letter-spacing:4px}.reveal{color:#f7d799;font-size:13px;margin-top:7px}.audio-game{margin:4px 0 12px}.game-top-buttons{display:flex;align-items:center;gap:7px;flex-wrap:wrap}#gameRules{max-height:250px}#cutin{position:fixed;z-index:500;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0}#cutin.show{animation:cutinIn 1.85s both}#cutin .cutin-band{width:110vw;transform:skewY(-5deg);min-height:175px;border-top:5px solid #ffe2aa;border-bottom:5px solid #ffe2aa;box-shadow:0 0 35px #ffc27788,0 12px 40px #000b;background:linear-gradient(93deg,#090c29,#401e49 48%,#092e35);display:grid;place-items:center;overflow:hidden}#cutin .cutin-inner{transform:skewY(5deg);text-align:center;padding:20px;width:100%;text-shadow:2px 4px 0 #0009,0 0 20px #e2b783a6}#cutin .cutin-inner small{display:block;color:#d9ae6b;letter-spacing:.45em;font:bold 15px Georgia;margin-bottom:12px}#cutinTitle{display:block;color:#fff4d4;font-size:clamp(27px,6vw,64px);font-weight:900;letter-spacing:.04em;line-height:1.25}#cutin .cutin-inner:before,#cutin .cutin-inner:after{content:'✦';font-size:35px;color:#f4cc77;padding:0 16px}@keyframes cutinIn{0%{opacity:0;transform:scale(1.22)}15%{opacity:1;transform:scale(1)}72%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.97)}}
@media(max-width:700px){.game-under{grid-template-columns:1fr}.audio-controls{grid-template-columns:1fr 1fr}.lobby-actions{gap:8px}.lobby-actions button{padding:8px}.player{flex:1 1 28%;min-width:90px}.table{margin:12px auto;min-height:240px}.game-rules{max-height:260px}.audio-game{padding:10px}}@media(max-width:420px){.audio-controls{grid-template-columns:1fr}.lobby-grid{width:100%}#cutin .cutin-band{min-height:145px}}

/* v0.5 Player portraits: shared unique avatar picks */
.avatar-panel{max-width:680px;margin:14px auto 18px;padding:13px 15px;border:1px solid #be9b635e;border-radius:14px;background:linear-gradient(145deg,#081c25d9,#12383899)}
.avatar-panel-head{display:flex;gap:9px;justify-content:space-between;align-items:baseline;flex-wrap:wrap;margin-bottom:9px}
.avatar-panel-head strong{font-size:16px;color:#ffe1a9}.avatar-panel-head span{font-size:12px;color:#c5cfc8}
.avatar-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px}
.avatar-choice{position:relative;border:2px solid #738b7a50;padding:3px;aspect-ratio:1;min-width:0;width:100%;border-radius:15px;background:#17333b;color:#fff;display:grid;place-items:center;transition:transform .12s,border-color .12s,box-shadow .12s;overflow:hidden}
.avatar-choice img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none}
.avatar-choice.chosen{border-color:#ffe39a;box-shadow:0 0 0 1px #e9c278,0 0 18px #e9c27865;background:#5d4f35;transform:translateY(-2px)}
.avatar-choice.taken{filter:saturate(.4);background:#15272c;opacity:.57;cursor:not-allowed}
.avatar-choice .avatar-taken{position:absolute;inset:auto 2px 3px;font-size:10px;background:#0a1824e8;padding:2px;border-radius:6px;color:#ffddbc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar-choice.chosen::after{content:'✓';position:absolute;right:2px;top:2px;display:grid;place-items:center;background:#edd080;color:#2c2517;width:17px;height:17px;font-size:12px;border-radius:50%;font-weight:900}
.avatar-caption{font-size:12px;color:#d4cbaf;min-height:20px;margin-top:8px}
.member-line{gap:10px;min-height:60px}.member-main{display:flex;align-items:center;gap:11px;min-width:0;flex:1}.member-main span{overflow-wrap:anywhere}.member-avatar{width:44px;height:44px;flex-shrink:0;display:block;object-fit:contain;filter:drop-shadow(0 2px 5px #0008)}.member-avatar.empty-avatar{opacity:.2;filter:grayscale(1)}
.player{min-width:150px;flex:1 1 165px}.player-head{display:flex;align-items:center;gap:7px;text-align:left}.player-head .player-avatar{width:58px;height:58px;object-fit:contain;flex-shrink:0;filter:drop-shadow(0 2px 5px #0007)}.player-head .player-text{flex:1;min-width:0}.player-head .player-name{display:block;overflow-wrap:anywhere;font-size:13px;line-height:1.5}.player-head .player-stats{font-size:12px;line-height:1.7;color:#e6d4b5}
.player.active .player-avatar{filter:drop-shadow(0 0 10px #ffe49bcc)}
@media(max-width:650px){.avatar-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.avatar-panel{padding:11px}.player{min-width:0;flex:1 1 45%;padding:7px}.player-head .player-avatar{width:43px;height:43px}.player-head .player-name{font-size:12px}.member-avatar{width:39px;height:39px}}
@media(prefers-reduced-motion:reduce){.avatar-choice{transition:none}}
/* v0.6: On-table starting-card showdown. */
.table.opening-mode{border-radius:44px;min-height:445px;padding:14px 14px 23px;transition:border-radius .25s;overflow:visible}
.table.opening-mode:after{opacity:.3;bottom:7px;font-size:13px}
.opening-mode>.status{z-index:1}
.opening-mode #center{width:100%;max-width:980px;min-height:0}
.opening-board{width:100%;padding:6px 10px 14px;text-align:center}
.opening-board-head .opening-eyebrow{font:700 10px/1.6 Georgia,serif;letter-spacing:.32em;color:#c9ddca;opacity:.85}
.opening-board-head h2{font-size:clamp(20px,3.5vw,30px);color:#ffe6a8;letter-spacing:.07em;margin:3px 0;text-shadow:0 3px 9px #001b19}
.opening-board-head p{font-size:12px;color:#e2e0c8;margin:2px 0 12px}
.opening-seats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));justify-content:center;gap:10px;max-width:760px;margin:auto}
.opening-seat{position:relative;min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 6px 8px;border:1px solid #d4bc8363;border-radius:13px;background:linear-gradient(145deg,#082b31ce,#123d3b9e);box-shadow:0 5px 15px #00161488;isolation:isolate}
.opening-identity{display:flex;align-items:center;justify-content:center;gap:7px;min-height:35px;max-width:100%;font-size:12px;color:#f8edce;text-align:left}
.opening-identity span{max-width:150px;overflow-wrap:anywhere}
.opening-avatar{display:block;width:37px;height:37px;object-fit:contain;flex:none;filter:drop-shadow(0 2px 3px #0009)}
.opening-face{min-height:101px;display:flex;align-items:center;justify-content:center;perspective:500px}
.opening-face .card{pointer-events:none}
.opening-card-back{box-shadow:0 8px 14px #0008}
.opening-unsubmitted{width:65px;height:95px;border-radius:8px;border:2px dashed #aeccbb88;display:grid;place-items:center;font:bold 35px Georgia;color:#d5e1d386;background:#ffffff09}
.opening-seat-note{color:#d4d9ce;font-weight:700;font-size:11px;min-height:17px}
.opening-seat.revealed .opening-face>.card{animation:openingFlip .68s cubic-bezier(.2,.85,.25,1) both;animation-delay:calc(var(--seat-order)*.10s)}
.opening-seat.opening-win{border-color:#ffe09b;box-shadow:0 0 0 1px #ffe09b7f,0 0 26px #f1cb7561;background:linear-gradient(145deg,#46543e,#21473b)}
.opening-seat.opening-win:before{content:'♛';position:absolute;top:-10px;right:7px;background:#f5d381;color:#343024;border-radius:50%;width:26px;height:26px;line-height:26px;font-size:20px;z-index:2;box-shadow:0 3px 7px #0005}
.opening-seat.opening-win .opening-seat-note{color:#ffe19c}
.opening-verdict{margin:13px auto 2px;padding:9px 15px;max-width:670px;border-radius:100px;background:linear-gradient(90deg,#6b431f7d,#b88944,#6b431f7d);border:1px solid #fff0bfa3;box-shadow:0 0 18px #f7d16e4c;color:#fffce3;font-weight:900;font-size:clamp(18px,3.6vw,27px);text-shadow:0 2px 4px #291b13;animation:verdictPop .56s .60s both}
.opening-verdict small{display:block;font-size:12px;font-weight:650;letter-spacing:.17em;color:#fcde9b}
.opening-verdict.tie{background:linear-gradient(90deg,#382c56,#6b467d,#382c56);border-color:#dac5fdad}
.opening-crown{color:#ffed9c;margin-right:9px}
.opening-wait{padding:9px;color:#ead8b2;font-size:12px;letter-spacing:.05em}
@keyframes openingFlip{0%{opacity:0;transform:translateY(-42px) rotateY(85deg) scale(.8)}60%{opacity:1;transform:translateY(5px) rotateY(-10deg) scale(1.04)}100%{opacity:1;transform:translateY(0) rotateY(0) scale(1)}}
@keyframes verdictPop{0%{opacity:0;transform:scale(.65)}70%{opacity:1;transform:scale(1.05)}100%{opacity:1;transform:scale(1)}}
@media(max-width:680px){.table.opening-mode{border-width:8px;border-radius:24px;padding:8px 5px 18px}.opening-board{padding:5px 4px 12px}.opening-seats{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.opening-seat{padding:7px 2px}.opening-face{min-height:72px}.opening-unsubmitted{width:44px;height:68px}.opening-identity{gap:3px;font-size:11px}.opening-avatar{width:31px;height:31px}.opening-board-head .opening-eyebrow{font-size:9px;letter-spacing:.15em}.opening-verdict{border-radius:15px}}
@media(prefers-reduced-motion:reduce){.opening-seat.revealed .opening-face>.card,.opening-verdict{animation:none}}
</style></head><body>
<section id="lobby"><h1>ハイブリッド<br>大富豪 EX</h1><div class="sub">HYBRID DAIFUGO · EXTRA</div><div class="panel"><div class="lobby-grid"><label for="name">プレイヤー名</label><input id="name" placeholder="プレイヤー名" maxlength="12" value="プレイヤー"><div class="lobby-actions"><button onclick="createRoom()">部屋を作る</button><button onclick="joinRoom()">部屋に入る</button></div><div class="lobby-divider">招待コードを入力して参加</div><div class="room-field"><input id="room" placeholder="例：HDEX-ABC123" aria-label="招待コード"></div></div><div id="lobbyStatus" class="small lobby-status">最大6人（CPUを含む）。部屋を作るか、招待コードを入力して参加してください。</div>
<div id="avatarPanel" class="avatar-panel"><div class="avatar-panel-head"><strong>プレイヤーアイコンを選択</strong><span>12種類・先着順（CPUはランダム）</span></div><div id="avatarGrid" class="avatar-grid" role="group" aria-label="アイコン一覧"></div><div id="avatarCaption" class="avatar-caption" aria-live="polite">好きなアイコンを選択してください。</div></div>
<div id="waiting" class="lobby-area hidden"><div class="waiting-head"><h2>待機室 <span id="code" class="room-code"></span></h2><button onclick="copyCode()">コードをコピー</button></div><div class="small" id="waitingNote"></div><div id="members"></div><div class="row"><button id="addCPU" onclick="addCPU()">＋ CPUを追加</button><button id="start" onclick="startGame()">ゲーム開始</button></div></div>
<details class="audio-panel"><summary>♫ サウンド設定（BGM / 効果音）</summary><div class="audio-controls"><div class="audio-col"><label><input type="checkbox" data-audio="music"> BGM ON/OFF</label><input aria-label="BGM音量" type="range" min="0" max="100" data-audio="musicVolume"><output></output></div><div class="audio-col"><label><input type="checkbox" data-audio="sfx"> 効果音 ON/OFF</label><input aria-label="効果音音量" type="range" min="0" max="100" data-audio="sfxVolume"><output></output></div></div></details>
<details class="game-rules"><summary style="cursor:pointer;color:#e7c17b;font-weight:700">EXルール一覧を表示</summary><div class="rules" id="rules"></div></details></div></section>
<main id="game" class="hidden"><header><strong style="color:#f1d297">♛ ハイブリッド大富豪 EX</strong><span id="round"></span><div class="game-top-buttons"><button id="nextRound" class="hidden" onclick="nextRound()">次のゲームへ</button><button onclick="location.reload()">退出</button></div></header><div class="players" id="players"></div><div class="table"><div class="status" id="turn"></div><div class="center" id="center"></div><div class="status" id="effect"></div></div>
<div class="controls" id="gameControls"><label id="wildBox" class="hidden">ジョーカーの代用数字 <select id="wildRank" onchange="refreshWild()"></select></label> <button id="play" onclick="sendAction('play')">選択したカードを出す</button> <button id="pass" onclick="sendAction('pass')">パス</button></div>
<div class="status" id="notice"></div><div class="status" id="exchangeInfo"></div><div class="status" id="openingInfo"></div><div class="hand" id="hand"></div>
<div class="game-under"><div class="panel"><strong>ゲームログ</strong><div class="log" id="log"></div></div><div class="panel"><details open><summary style="cursor:pointer;color:#f8d9a5;font-weight:700">特殊役ルール一覧（タップして折り畳み）</summary><div class="rules" id="gameRules"></div></details><details class="audio-panel audio-game"><summary>♫ BGM・効果音設定</summary><div class="audio-controls"><div class="audio-col"><label><input type="checkbox" data-audio="music"> BGM ON/OFF</label><input aria-label="BGM音量" type="range" min="0" max="100" data-audio="musicVolume"><output></output></div><div class="audio-col"><label><input type="checkbox" data-audio="sfx"> 効果音 ON/OFF</label><input aria-label="効果音音量" type="range" min="0" max="100" data-audio="sfxVolume"><output></output></div></div></details></div></div></main>
<div id="cutin" aria-live="polite"><div class="cutin-band"><div class="cutin-inner"><small>EX ABILITY ACTIVATED</small><span id="cutinTitle"></span></div></div></div><script src="app.js?v=0.6.0"></script></body></html>
